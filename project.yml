# XcodeGen spec — the .xcodeproj is generated from this file and never committed (ADR-0003).
#   brew install xcodegen && xcodegen generate
name: BuckleUpQuiz
options:
  bundleIdPrefix: com.jcena
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Automatic signing. The team id is injected by the release workflow from
    # vars.APPLE_TEAM_ID (ADR-0014); simulator builds don't need one.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages:
  QuizCore:
    path: Packages/QuizCore

targets:
  BuckleUpQuiz:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      # Bundled as a folder reference so the app reads Content/topics.json + Content/questions/*.json.
      - path: Content
        type: folder
        buildPhase: resources
    dependencies:
      - package: QuizCore
    info:
      path: App/Info.plist # generated
      properties:
        CFBundleDisplayName: BuckleUp Quiz
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [audio]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Anonymous error reports endpoint (ADR-0020). Empty keeps reports on the device.
        BUQTelemetryURL: $(TELEMETRY_URL)
        # Downloaded question updates (ADR-0031). An empty URL or key turns downloads off.
        BUQContentURL: $(CONTENT_URL)
        BUQContentPublicKey: $(CONTENT_PUBLIC_KEY)
        # The bundled questions' version: the release workflow sets the commit time.
        BUQContentVersion: $(CONTENT_VERSION)
        NSMicrophoneUsageDescription: >-
          Used to hear your child's answers. Audio is processed on this device and never stored or sent anywhere.
        NSSpeechRecognitionUsageDescription: >-
          Used to understand your child's spoken answers. Speech is recognised on this device and never stored or sent anywhere.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jcena.buckleupquiz
        PRODUCT_NAME: BuckleUpQuiz
        # iPhone only for v1; iPad after launch (product decision, 2026-11-22).
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/BuckleUpQuiz.entitlements
        # Error reports (ADR-0020/0021). Builds before v0.3.5 use the CloudFront address, which
        # keeps working.
        TELEMETRY_URL: "https://api.buckleupquiz.com/v1/reports"
        # Question updates (ADR-0031). The public key comes from `make content-signing-key`;
        # until it's set, the app plays only its bundled questions.
        CONTENT_URL: "https://api.buckleupquiz.com/content/v1/"
        CONTENT_PUBLIC_KEY: ""
        CONTENT_VERSION: "0"


  BuckleUpQuizTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
    dependencies:
      - target: BuckleUpQuiz
      - package: QuizCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jcena.buckleupquiz.tests

schemes:
  BuckleUpQuiz:
    build:
      targets:
        BuckleUpQuiz: all
        BuckleUpQuizTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - BuckleUpQuizTests
    run:
      config: Debug
    archive:
      config: Release
