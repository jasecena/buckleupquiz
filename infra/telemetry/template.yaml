AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  BuckleUp Quiz anonymous error reports (ADR-0020). A Lambda function URL accepts batches of
  events from the app and writes each one as a structured log line. Logs are kept 90 days.
  Nothing else is stored: no IP addresses, no headers, no identifiers.

Parameters:
  RetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [30, 60, 90, 180, 365]
  MaxConcurrency:
    Type: Number
    Default: 0
    Description: >-
      Reserved concurrency to cap cost if the endpoint is abused. 0 = no reservation (new
      accounts with a 10-execution limit can't reserve any).

Conditions:
  CapConcurrency: !Not [!Equals [!Ref MaxConcurrency, 0]]

Resources:
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /buckleupquiz/telemetry
      RetentionInDays: !Ref RetentionDays

  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-telemetry-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${Logs.Arn}"

  Function:
    Type: AWS::Lambda::Function
    Properties:
      Description: BuckleUp Quiz anonymous error reports (ADR-0020)
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt Role.Arn
      ReservedConcurrentExecutions: !If [CapConcurrency, !Ref MaxConcurrency, !Ref "AWS::NoValue"]
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref Logs
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
      Code:
        ZipFile: |
          // Validates a batch and logs each event. Never logs the request's IP or headers.
          const MAX_BODY = 1000000;
          const NAME = /^[A-Za-z0-9._-]{1,64}$/;
          const str = (v, n) => (typeof v === "string" ? v.slice(0, n) : undefined);
          exports.handler = async (event) => {
            if (event.requestContext?.http?.method !== "POST") return { statusCode: 405 };
            let body = event.body || "";
            if (event.isBase64Encoded) body = Buffer.from(body, "base64").toString("utf8");
            if (body.length > MAX_BODY) return { statusCode: 413 };
            let p;
            try { p = JSON.parse(body); } catch { return { statusCode: 400 }; }
            if (p?.schema !== 1 || !Array.isArray(p.events) || p.events.length > 50) {
              return { statusCode: 400 };
            }
            const context = {
              app: str(p.app, 16), build: str(p.build, 16), os: str(p.os, 32),
              device: str(p.device, 32), launch: str(p.launch, 40),
            };
            for (const e of p.events) {
              if (!e || !NAME.test(e.name || "")) continue;
              const fields = {};
              for (const [k, v] of Object.entries(e.fields || {}).slice(0, 20)) {
                if (NAME.test(k) && typeof v === "string") fields[k] = v.slice(0, 60000);
              }
              console.info({ kind: "telemetry", ...context, name: e.name, at: str(e.at, 32), fields });
            }
            return { statusCode: 204 };
          };

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: NONE

  PublicUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  PublicInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  Endpoint:
    Description: Put this in project.yml as TELEMETRY_URL.
    Value: !GetAtt FunctionUrl.FunctionUrl
  LogGroup:
    Value: !Ref Logs
